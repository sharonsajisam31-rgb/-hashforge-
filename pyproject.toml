[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hashforge"
version = "1.0.0"
description = "Hash cracking toolkit with rule engine and password analysis"
readme = "README.md"
authors = [
    {name = "HashForge"},
]
license = {text = "MIT"}
requires-python = ">=3.8"

[project.scripts]
hashforge = "hashforge.cli:main"
